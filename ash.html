<style>
  :root{
    --bg:#11151c;
    --bg-sidebar:#0c0f15;
    --bg-elevated:#1a212b;
    --bg-input:#1b2330;
    --border:#2a3442;
    --text:#eef1f6;
    --text-muted:#94a1b4;
    --text-faint:#5f6c7d;
    --ember-1:#7c8cf5;
    --ember-2:#4a5ed6;
    --ember-3:#b7c0ff;
    --danger:#e5484d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  ::selection{background:rgba(124,140,245,.35);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#332b23;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#443a2f;}

  .app{display:flex;height:100vh;width:100vw;position:relative;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:272px;
    flex-shrink:0;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:margin-left .25s ease;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 16px 14px;
  }
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.2px;
  }
  .new-chat{
    margin:4px 12px 10px;
    padding:10px 14px;
    background:linear-gradient(135deg,var(--ember-2),var(--ember-1));
    border:none;
    border-radius:10px;
    color:#f4f6ff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:filter .15s;
  }
  .new-chat:hover{filter:brightness(1.08);}
  .new-chat svg{width:16px;height:16px;}

  .chat-list{
    flex:1;
    overflow-y:auto;
    padding:6px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text-muted);
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    position:relative;
  }
  .chat-item .title{overflow:hidden;text-overflow:ellipsis;flex:1;}
  .chat-item:hover{background:var(--bg-elevated);color:var(--text);}
  .chat-item.active{background:var(--bg-elevated);color:var(--text);}
  .chat-item .del{
    opacity:0;
    width:14px;height:14px;
    flex-shrink:0;
    color:var(--text-faint);
  }
  .chat-item:hover .del{opacity:1;}
  .chat-item .del:hover{color:var(--danger);}

  .sidebar-foot{
    padding:12px 16px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-faint);
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--text-muted);
  }
  .menu-btn{
    display:none;
    background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;
  }
  .menu-btn svg{width:20px;height:20px;}

  .thread{
    flex:1;
    overflow-y:auto;
    padding:24px 0 10px;
  }
  .thread-inner{
    max-width:720px;
    margin:0 auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* empty state */
  .empty{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:0 20px;
  }
  .empty svg{width:56px;height:56px;}
  .empty h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    margin:0;
    font-weight:600;
  }
  .empty p{color:var(--text-muted);margin:0;max-width:360px;font-size:14.5px;}
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:8px;
    max-width:520px;
  }
  .suggestion{
    border:1px solid var(--border);
    background:var(--bg-elevated);
    color:var(--text-muted);
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
  }
  .suggestion:hover{border-color:var(--ember-1);color:var(--text);}

  /* messages */
  .msg{display:flex;gap:12px;align-items:flex-start;}
  .msg .avatar{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .msg.user .avatar{background:var(--bg-elevated);color:var(--text-muted);font-size:12px;font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .msg.assistant .avatar{background:transparent;}
  .msg.assistant .avatar svg{width:26px;height:26px;}
  .bubble{
    font-size:15px;
    line-height:1.65;
    white-space:pre-wrap;
    word-wrap:break-word;
    padding-top:3px;
  }
  .msg.user .bubble{color:var(--text);}
  .msg.assistant .bubble{color:var(--text);}
  .bubble code{
    background:var(--bg-elevated);
    padding:2px 6px;
    border-radius:5px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
  }
  .bubble pre{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    padding:12px 14px;
    border-radius:10px;
    overflow-x:auto;
  }
  .bubble pre code{background:none;padding:0;}
  .gen-image-wrap{margin-top:10px;max-width:420px;}
  .gen-image{
    width:100%;
    display:block;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg-elevated);
  }
  .gen-image-error{
    padding:14px;
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--text-faint);
    font-size:13.5px;
  }

  .typing{display:flex;gap:5px;padding:8px 0 0 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ember-1);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}

  /* input */
  .composer-wrap{
    padding:12px 20px 20px;
  }
  .composer{
    max-width:720px;
    margin:0 auto;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:16px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 10px 10px 16px;
    transition:border-color .15s;
  }
  .composer:focus-within{border-color:var(--ember-1);}
  .composer textarea{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    max-height:160px;
    padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--text-faint);}
  .send-btn{
    width:34px;height:34px;
    border-radius:9px;
    border:none;
    background:linear-gradient(135deg,var(--ember-2),var(--ember-1));
    color:#f4f6ff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:filter .15s, opacity .15s;
  }
  .send-btn:disabled{opacity:.35;cursor:default;}
  .send-btn:not(:disabled):hover{filter:brightness(1.1);}
  .send-btn svg{width:16px;height:16px;}
  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:8px;
    max-width:720px;
    margin-left:auto;margin-right:auto;
  }

  .overlay{display:none;}

  @media (max-width:760px){
    .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:20;margin-left:-272px;}
    .sidebar.open{margin-left:0;box-shadow:0 0 40px rgba(0,0,0,.5);}
    .menu-btn{display:inline-flex;}
    .overlay.show{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;
    }
  }
</style>
</head>

  // ---------- image-generation intent detection ----------
  // Matches English + Roman Urdu + Urdu-script phrases asking to draw/generate a picture.
  const IMAGE_INTENT_RE = /\b(generate|make|create|draw|paint)\b.*\b(image|picture|pic|photo|art|wallpaper|drawing)\b|\b(image|picture|pic|photo)\s+of\b|\btasveer\b|\btasveer\s*bana|\bpic\s*bana|\bimage\s*bana|\bphoto\s*bana|\bbana\s*do\b.*\b(tasveer|pic|photo|image)\b|تصویر|تصوير/i;

  function extractImagePrompt(text){
    // Strip common trigger phrases (EN + Roman Urdu) to leave just the subject.
    let p = text
      .replace(/\b(please|plz|can you|could you)\b/gi,'')
      .replace(/\b(generate|make|create|draw|paint)\s+(me\s+)?(an?\s+)?(image|picture|pic|photo|art|wallpaper|drawing)\s*(of)?\b/gi,'')
      .replace(/\bek\b/gi,'')
      .replace(/\btasveer\s*(bana|banao|bana\s*do|bnado)?\b/gi,'')
      .replace(/\b(pic|photo|image)\s*(bana|banao|bana\s*do|bnado)?\b/gi,'')
      .replace(/\bbana\s*do\b/gi,'')
      .replace(/\bki\b/gi,'')
      .replace(/\bka\b/gi,'')
      .replace(/^\s*(of|ka|ki|ke)\s*/i,'')
      .trim();
    return p || text.trim();
  }

  // ---------- persistence ----------
  async function loadChats(){
    try{
      const idx = await window.storage.get('chat-index', false);
      const ids = idx ? JSON.parse(idx.value) : [];
      const loaded = [];
      for(const id of ids){
        try{
          const r = await window.storage.get('chat:'+id, false);
          if(r) loaded.push(JSON.parse(r.value));
        }catch(e){}
      }
      loaded.sort((a,b)=> (b.updated||0) - (a.updated||0));
      chats = loaded;
    }catch(e){ chats = []; }
    renderChatList();
  }

  async function saveIndex(){
    try{
      await window.storage.set('chat-index', JSON.stringify(chats.map(c=>c.id)), false);
    }catch(e){}
  }
  async function saveChat(chat){
    try{ await window.storage.set('chat:'+chat.id, JSON.stringify(chat), false); }catch(e){}
  }
  async function deleteChatStorage(id){
    try{ await window.storage.delete('chat:'+id, false); }catch(e){}
  }

  // ---------- rendering ----------
  function renderChatList(){
    chatList.innerHTML = '';
    chats.forEach(c=>{
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id===activeId ? ' active' : '');
      item.innerHTML = `<span class="title">${escapeHtml(c.title||'New chat')}</span>
        <svg class="del" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`;
      item.addEventListener('click', (e)=>{
        if(e.target.closest('.del')) return;
        openChat(c.id);
      });
      item.querySelector('.del').addEventListener('click', async (e)=>{
        e.stopPropagation();
        chats = chats.filter(x=>x.id!==c.id);
        await deleteChatStorage(c.id);
        await saveIndex();
        if(activeId===c.id){ activeId=null; showEmpty(); }
        renderChatList();
      });
      chatList.appendChild(item);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function formatContent(text){
    let escaped = escapeHtml(text);
    escaped = escaped.replace(/```([\s\S]*?)```/g, (m,code)=>`<pre><code>${code.trim()}</code></pre>`);
    escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return escaped;
  }

  function showEmpty(){
    emptyState.style.display = 'flex';
    threadInner.style.display = 'none';
    threadInner.innerHTML = '';
    topbarTitle.textContent = 'New chat';
    renderChatList();
  }

  function openChat(id){
    activeId = id;
    const chat = chats.find(c=>c.id===id);
    if(!chat) return showEmpty();
    emptyState.style.display = 'none';
    threadInner.style.display = 'flex';
    threadInner.innerHTML = '';
    chat.messages.forEach(m => appendMessage(m.role, m.content, false, m.image));
    topbarTitle.textContent = chat.title || 'New chat';
    renderChatList();
    scrollToBottom();
    closeSidebarMobile();
  }

  function appendMessage(role, content, animate, imageUrl){
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const avatar = role==='user'
      ? `<div class="avatar">You</div>`
      : `<div class="avatar">${AVATAR_ASH}</div>`;
    const imgHtml = imageUrl
      ? `<div class="gen-image-wrap"><img class="gen-image" src="${imageUrl}" alt="Generated image" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'gen-image-error\\'>Image generate nahi ho saki, dobara try karein.</div>'"></div>`
      : '';
    row.innerHTML = `${avatar}<div class="bubble">${formatContent(content)}${imgHtml}</div>`;
    threadInner.appendChild(row);
    if(animate) scrollToBottom();
    return row;
  }

  function appendTyping(){
    const row = document.createElement('div');
    row.className = 'msg assistant';
    row.id = 'typingRow';
    row.innerHTML = `<div class="avatar">${AVATAR_ASH}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    threadInner.appendChild(row);
    scrollToBottom();
  }
  function removeTyping(){
    const r = document.getElementById('typingRow');
    if(r) r.remove();
  }

  function scrollToBottom(){
    requestAnimationFrame(()=>{ thread.scrollTop = thread.scrollHeight; });
  }

  // ---------- sending ----------
  async function sendMessage(text){
    if(!text.trim() || sending) return;
    sending = true;
    sendBtn.disabled = true;

    if(!activeId){
      const chat = { id: uid(), title: text.slice(0,40), messages: [], updated: Date.now() };
      chats.unshift(chat);
      activeId = chat.id;
      emptyState.style.display = 'none';
      threadInner.style.display = 'flex';
      threadInner.innerHTML = '';
      topbarTitle.textContent = chat.title;
    }
    const chat = chats.find(c=>c.id===activeId);

    chat.messages.push({role:'user', content:text});
    appendMessage('user', text, true);
    input.value = '';
    autoResize();
    appendTyping();

    // ---- Image generation path ----
    if(IMAGE_INTENT_RE.test(text)){
      try{
        const prompt = extractImagePrompt(text);
        const seed = Math.floor(Math.random()*100000);
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${seed}`;
        removeTyping();
        const replyText = `Yeh raha aapka generated image — "${prompt}":`;
        chat.messages.push({role:'assistant', content: replyText, image: imgUrl});
        appendMessage('assistant', replyText, true, imgUrl);
        chat.updated = Date.now();
        await saveChat(chat);
        await saveIndex();
        renderChatList();
      }catch(err){
        removeTyping();
        appendMessage('assistant', "Image generate nahi ho saki — dobara try karein.", true);
      }finally{
        sending = false;
        updateSendState();
      }
      return;
    }

    try{
      const apiMessages = chat.messages.map(m => ({role: m.role, content: m.content}));
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: "You are ASH, a friendly, sharp, and highly capable AI assistant embedded in the ASH chat app. Your job is to actually solve the user's problem — give clear, actionable, step-by-step help for coding, business, study, writing, or everyday questions, not vague generalities. Be warm, direct, and concise unless depth is asked for. Match the user's language (English, Urdu, or Roman Urdu) and switch instantly if they switch. If the user asks you to generate, draw, or create an image/picture/tasveer, note that the app handles that separately via its image generator, so simply confirm briefly rather than describing an image in words.",
          messages: apiMessages
        })
      });
      const data = await response.json();
      removeTyping();

      let replyText = '';
      if(data && data.content){
        replyText = data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      }
      if(!replyText) replyText = "Sorry, I couldn't generate a response just now. Please try again.";

      chat.messages.push({role:'assistant', content: replyText});
      appendMessage('assistant', replyText, true);
      chat.updated = Date.now();
      await saveChat(chat);
      await saveIndex();
      renderChatList();
    }catch(err){
      removeTyping();
      appendMessage('assistant', "Connection error — please check your network and try again.", true);
    }finally{
      sending = false;
      updateSendState();
    }
  }

  function autoResize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  function updateSendState(){
    sendBtn.disabled = sending || !input.value.trim();
  }

  input.addEventListener('input', ()=>{ autoResize(); updateSendState(); });
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      if(!sendBtn.disabled) sendMessage(input.value);
    }
  });
  sendBtn.addEventListener('click', ()=> sendMessage(input.value));

  newChatBtn.addEventListener('click', ()=>{
    activeId = null;
    showEmpty();
    input.value=''; autoResize(); updateSendState();
    closeSidebarMobile();
  });

  document.querySelectorAll('.suggestion').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      input.value = btn.dataset.prompt;
      updateSendState();
      sendMessage(input.value);
    });
  });

  menuBtn.addEventListener('click', ()=>{
    sidebar.classList.add('open');
    overlay.classList.add('show');
  });
  overlay.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  loadChats();
  showEmpty();
})();
</script>
